# Dynamic resource couplings such as resources.files with dotted module names are a
# known static-graph blind spot.  They require a broader no-cover allowlist, but
# the selector fails closed to the full suite rather than silently missing tests.
full_scope:
  - pyproject.toml
  - uv.lock
  - conftest.py
  - "**/conftest.py"
  - "src/configs/**"
  - scripts/tool_scripts/affected_tests.py
  - scripts/tool_scripts/affected_tests_rules.yaml
  - tests/b4b_contract_fixture.py
  - tests/b5_test_helpers.py
uncovered_allowlist:
  scripts/tool_scripts/_grade_transform.py: "private render helper; no direct project test imports it"
  scripts/tool_scripts/reading_regression.py: >-
    milestone gate CLI (2026-08-18); scores an already-completed run against the
    recorded good-form baselines. No project-side test imports it. Verified by hand
    in BOTH directions at introduction: run_2026-07-07_haiku_cv_retest exits 0 (PASS)
    and run_2026-08-18_707mode_J3 exits 1 (REGRESSED, walls 1<9 windows 0<6), so it
    is not a green-only gate.
  scripts/tool_scripts/baseline_record.py: "maintenance CLI; no project-side test exercises it"
  scripts/tool_scripts/gt_promote.py: "release-signoff CLI; covered only through manual promotion workflow"
  scripts/tool_scripts/gt_review_build.py: "review bundle build CLI; thin wrapper over build_review_bundle (covered by tests/test_gt_promotion_path.py); no project-side test exercises the CLI itself"
  scripts/tool_scripts/gt_review_rerun.py: "review rerun CLI; no project-side test exercises it"
  scripts/tool_scripts/gt_review_sign.py: "review signing CLI; no project-side test exercises it"
  scripts/tool_scripts/preprocess_images.py: "maintenance image-preprocessing CLI; no project-side test exercises it"
  scripts/tool_scripts/record_baseline.py: "maintenance baseline-recording CLI; no project-side test exercises it"
  scripts/tool_scripts/render_building_3d.py: "manual visualization CLI; no project-side test exercises it"
  scripts/tool_scripts/render_geometry_viewer.py: "manual visualization CLI; no project-side test exercises it"
  scripts/tool_scripts/render_vector_to_png.py: "manual conversion CLI; no project-side test exercises it"
  scripts/tool_scripts/render_vector_to_svg.py: "manual conversion CLI; no project-side test exercises it"
  scripts/tool_scripts/spawn_isolated_reader.py: "isolation helper invoked outside the project test graph"
  src/agent/execution/isolation_templates/__init__.py: "isolation-template package marker; no direct project test imports it"
  src/agent/execution/isolation_templates/guard.py: "resources.files dynamically injects this into staging; test_isolation executes its copy inside isolated staging, which the static graph cannot capture, so no-cover falls back to FULL"
  src/database/datatools/_share.py: "database tooling module; no project-side tests cover this legacy area"
  src/database/datatools/constructions.py: "database tooling module; no project-side tests cover this legacy area"
  src/database/datatools/datadescription.py: "database tooling module; no project-side tests cover this legacy area"
  src/database/datatools/designday.py: "database tooling module; no project-side tests cover this legacy area"
  src/database/datatools/nomass_materials.py: "database tooling module; no project-side tests cover this legacy area"
  src/database/datatools/schedulecompact.py: "database tooling module; no project-side tests cover this legacy area"
  src/database/datatools/scheduletypelimits.py: "database tooling module; no project-side tests cover this legacy area"
  src/database/datatools/standard_materials.py: "database tooling module; no project-side tests cover this legacy area"
  src/agent/reading/as_drawn/__init__.py: >-
    package marker for the as-drawn reading toolbox, transplanted 2026-08-25 from
    AI_agent/logs/experiments/2026-08-23_as_drawn_reading_prototype/tools/ (dispatch:
    2026-08-25_reading_toolbox_into_src_dispatch.md); no project-side test imports
    the package root directly.
  src/agent/reading/as_drawn/_plan_ink.py: >-
    transplanted 2026-08-25 from tools/plan_ink.py, byte-identical apart from its
    own new module path; no project-side test imports src/ directly yet. Verified
    by hand: rebuilding all three exploration views (sm25 1F/2F, sm24) through the
    new src/ location and `cmp -s` against the tracked exploration reference
    out/{view}_v2.json, all three byte-identical.
  src/agent/reading/as_drawn/as_drawn_v2.py: >-
