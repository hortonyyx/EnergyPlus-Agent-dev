# Sections below = verbatim copy of src/configs/llm.yaml at run time (no
# per-run overrides; intake_correction = deepseek-v4-pro; mep unused).
# Multi-section LLM config (2026-05-07: per-subagent overrides).
#
# Each subagent calls `create_llm(node_name="<name>")` with its own name:
#   intake / zone / material / schedule / construction / surface /
#   fenestration / hvac / people / lights
#
# Resolution rule (see src/agent/llm.py:load_llm_section):
#   1) if a section matching `node_name` exists → use it
#   2) else → fall back to `default`
#
# To override one subagent only, add a section keyed by its node name (any
# subset of fields; missing fields are NOT inherited from `default` — the whole
# section is parsed standalone, so list every field you need).
#
# Required env vars (put in .env):
#   - DEEPSEEK_API_KEY=sk-...   (downstream default)
#   - ANTHROPIC_API_KEY=sk-...  (intake; optional — only if you drive intake
#                                via the Anthropic API rather than the half-manual
#                                Claude Code session described in new_case_guide.md)
#
# Example: override surface_agent to a stronger model while leaving the other
# 8 downstream subagents on the `default` DeepSeek config:
#
#   surface:
#     provider: anthropic
#     api_key: ${oc.env:ANTHROPIC_API_KEY,null}
#     model_name: claude-sonnet-4-6
#     temperature: 0.3
#     max_tokens: 64000

default:
  provider: openai                                    # OpenAI-compatible protocol
  base_url: ${oc.env:DEEPSEEK_BASE_URL,https://api.deepseek.com}
  api_key: ${oc.env:DEEPSEEK_API_KEY,null}
  model_name: deepseek-v4-pro
  temperature: 0.7
  max_tokens: 64000
  # Disable v4-pro thinking mode: ReAct multi-turn loops would otherwise need to
  # pass reasoning_content back each turn, which langchain_openai doesn't do →
  # 400 "reasoning_content must be passed back to the API". See pipeline_run.log
  # 2026-05-07 sm_16_newarch material_agent failure.
  extra_body:
    thinking:
      type: disabled

# Staged intake pipeline LLM sections (intake_node runs the pipeline when
# reading-stage vectors are provided: --reading-from). The pipeline makes two LLM
# calls: 1_correction and 4_mep (the geometry stages 2/3 + assembly 5 are
# deterministic code, no LLM). Read by src/agent/pipeline.py via a RAW OpenAI
# client (not langchain): each call is single-shot and WANTS DeepSeek thinking ON
# (langchain_openai would burn the output budget on reasoning_content).
# thinking=enabled here is deliberate and differs from `default` (which disables
# it for the ReAct downstream loops).
#
# intake_correction: text-only correction over reading-stage vectors. This is the
# primary intake section; `intake_mep` falls back to it if absent.
intake_correction:
  provider: openai
  base_url: ${oc.env:DEEPSEEK_BASE_URL,https://api.deepseek.com}
  api_key: ${oc.env:DEEPSEEK_API_KEY,null}
  model_name: deepseek-v4-pro
  temperature: 0.3
  max_tokens: 64000
  # DeepSeek thinking effort: "high" (default) or "max" (more exhaustive, slower
  # /costlier). low/medium map to high, xhigh to max. Read by src/agent/pipeline.py;
  # omit the key entirely to fall back to the provider default.
  reasoning_effort: high
  extra_body:
    thinking:
      type: enabled

# intake_mep (optional override for the 4_mep physics stage). If absent, the
# pipeline falls back to intake_correction. Add a section here only to run 4_mep
# on a different model than 1_correction.
# intake_mep:
#   provider: openai
#   base_url: ${oc.env:DEEPSEEK_BASE_URL,https://api.deepseek.com}
#   api_key: ${oc.env:DEEPSEEK_API_KEY,null}
#   model_name: deepseek-v4-pro
#   temperature: 0.3
#   max_tokens: 64000

# intake_reading (FUTURE, full-auto reading stage): a multimodal VLM that turns
# images into reading-stage vector JSON, so the pipeline can run without a Claude
# Code session. Not wired yet — dev currently does the reading stage half-manually
# in a Claude Code Opus session.
# intake_reading:
#   provider: anthropic
#   base_url: ${oc.env:ANTHROPIC_BASE_URL,null}
#   api_key: ${oc.env:ANTHROPIC_API_KEY,null}
#   model_name: claude-opus-4-7
#   temperature: 0.4
#   max_tokens: 64000

# Per-subagent partition (2026-05-07, ref: baseline run
# test_data/test_baseline/runs/2026-05-07_sm_16_newarch_v4pro_no_sim_v1/notes.md §3.2):
#   default (pro) — surface / construction / fenestration: baseline 实证 flash
#     会漏 window construction / 几何瓶颈，必须 pro。不再单独写 section，吃 default。
#   flash overrides — zone / material / schedule / hvac / people / lights:
#     CRUD-style 节点，flash 够用。lights/people/hvac 在 baseline 实证；
#     zone/material/schedule 暂未 isolated 验证，沿用 new_case_guide.md:243 判断。
#     若哪个 flash 节点在新 case 上掉链，把对应段删掉即可 fallback 到 default(pro)。

zone: &flash
  provider: openai
  base_url: ${oc.env:DEEPSEEK_BASE_URL,https://api.deepseek.com}
  api_key: ${oc.env:DEEPSEEK_API_KEY,null}
  model_name: deepseek-v4-flash
  temperature: 0.7
  max_tokens: 64000
  extra_body:
    thinking:
      type: disabled

material: *flash
schedule: *flash
hvac: *flash
people: *flash
lights: *flash
