# =====================================================================
# run_config.yaml — run_2026-08-01_haiku_w5_scoped_d2 (sm24_anchor)
#
# 【W5 · 减卷无监督识图 · 第 2 抽】
# 用户 2026-08-01 拍板：同一套配置**独立考两遍**（d1 / d2），只跑识图 + 出分。
#
# 本实验回答一个问题，且只回答这一个：
#   「W1（先量再画提到顶层非可选）+ W3（探针回执可操作）+ W4（减卷到两张图）
#     全部就位之后，Haiku 4.5 在完全无监督下**到底会不会真的去量**，成绩是多少？」
#
# 这是整条线一直缺的那格数：08-01 基线证明了「环节自己能走完输入→输出」，
# 但成绩不合格，且**根因是两臂都没去测量**（A 臂跑了 0 个探针，唯一一次标定
# 尝试被守卫按语法拒了一次就整个放弃）。W1 与 W3 正是针对这两个失败形状。
#
# ---------------------------------------------------------------------
# 为什么考两遍（用户 08-01 拍板）
# ---------------------------------------------------------------------
#   本项目被「单次成绩当信号」坑过多次（06-25 四臂实验结论 = run 方差主导）。
#   两遍完全独立、零信息交流，才分得清「改好了」还是「运气好」。
#   两遍同时也正是用户定的**整轮盲重抽**机制（≤3 次），不是「打回续作」。
#   d1 与 d2 **一切配置相同**：同模型、同 skill、同硬隔离、同减卷范围、
#   同预扫固定档、同判卷尺。**唯一差别 = 它们是两次独立抽取。**
#
# ---------------------------------------------------------------------
# 无监督的硬定义（本 run 的硬约束，违反即本 run 作废）
# ---------------------------------------------------------------------
#   ⛔ 零 per-run directive        —— `spawn --directive` 不传
#   ⛔ 零 feedback                 —— staging 内不得出现 feedback.md
#   ⛔ 零中途反馈 / 零打回续作      —— 主控不回答子代理的任何提问；
#                                     它若中途停下提问，本轮即以「未完成」计，不补话
#   ⛔ 预扫参数不得看着结果临时挑    —— 用 cv_toolbox.md 已写死的固定档（见下）
#   ⛔ d1 的任何结果不得影响 d2 的任何配置或输入
#   ✅ 允许：主控编排（建 staging / spawn / merge）、硬隔离、判卷用生产尺子
#
# 判据来源 = CLAUDE.md §1.5 不变量 #7 + 用户 08-01 校准：
#   「拿掉主控整个流程跑不出来可以接受，但需要各个环节本身能完成输入到输出的过程」
#   「judge 可以全部打回盲重抽，但不能给任何信息，相当于另外做一次」
#
# ---------------------------------------------------------------------
# 减卷（W4 首次实战）
# ---------------------------------------------------------------------
#   本轮只考 1f_view（平面）+ South_view（立面）。
#   ⚠️「减少题量 ≠ 中途打断」：范围在**开考前**由下面的声明定死，
#      provision 时冻进 `_run/reading_exam_scope.json` 并绑哈希，**考中不可变更**
#      （resolver 六道守卫 + merge 一道守卫，全部有摘掉即红的锁，08-01 已验真）。
#   范围内缺产物仍 BLOCK；范围外三张显式记「不在本轮考试范围」并带声明来源。
#   判卷分母只含这两张（消费侧取子集，签名件不动）。
#
# 预扫固定档（**跑前写死，跑完不论结果如何都不改**）——
# 出处 skills/intake_pipeline/0_reading/cv_toolbox.md §"Budget prescan candidates"：
#   平面 1f_view    : prescan-plan      --min-strength 0.08 --min-line-len-px 30
#   立面 South_view : prescan-elevation --min-strength 0.08 --min-line-len-px 30 --no-cc
#   ⚠️ 只预扫范围内的两张（范围外的三张不预扫——它们不在本轮考试里）。
# =====================================================================

reading_exam_scope:
  input_ids: [1f_view, South_view]
  reason: W5 reduced-scope unsupervised reading draw; one plan view plus one elevation

scope:
  stages:
    - 0_reading           # 本 run 只到识图 + 判卷；下游不跑（用户 08-01 拍板）

judge:
  mode: "stop"            # 判卷停点由主控裁；但**不得**把裁定内容回灌给读图器

review:
  reading: false
  correction: false
  geometry: false         # 不跑几何段

models:
  reading: claude-haiku-4-5-20251001

capability_profile: orthogonal_polygon

grade:
  reading:
    wall_tol_m: 0.30      # 与 07-07 / 07-30 / 08-01 历史对账同一把尺，不得放松
    window_centre_tol_m: 0.40
  correction:
    wall_tol_m: 0.30
    window_centre_tol_m: 0.40

# CLI 承载项（非 RunConfig 字段，记此备查）:
#   run_profile = regression（fail-closed，与历史各轮同档）
#   不 --record（只到识图，无完整基线可录）
