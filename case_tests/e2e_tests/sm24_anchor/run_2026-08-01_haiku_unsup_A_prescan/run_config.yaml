# =====================================================================
# run_config.yaml — run_2026-08-01_haiku_unsup_A_prescan (sm24_anchor)
#
# 【无监督识图基线 · A 臂（带预扫）】
# 用户 2026-08-01 拍板：先花一次识图跑出无监督基线，两臂都跑（带预扫 / 不带）。
#
# 本实验回答一个问题，且只回答这一个：
#   「把所有监督拿掉之后，Haiku 4.5 在现有 standing 脚手架下独立读完 sm24，
#     坐标级成绩到底是多少？」
# 在拿到这个数之前，任何「质量恢复了 / 退化了」的判断都没有依据（用户 07-31 口径）。
#
# ---------------------------------------------------------------------
# 无监督的定义（本 run 的硬约束，违反即本 run 作废）
# ---------------------------------------------------------------------
#   ⛔ 零 per-run directive        —— `spawn --directive` 不传
#   ⛔ 零 feedback                 —— staging 内不得出现 feedback.md
#   ⛔ 零中途反馈 / 零打回续作      —— 主控不回答子代理的任何提问；
#                                     它若中途停下提问，本轮即以「未完成」计，不补话
#   ⛔ 预扫参数不得看着结果临时挑    —— 用 cv_toolbox.md 已写死的固定档（见下）
#   ✅ 允许：主控编排（建 staging / spawn / merge）、硬隔离、判卷用生产尺子
#
# 判据来源 = CLAUDE.md §1.5 不变量 #7 + 用户 08-01 校准：
#   「拿掉主控整个流程跑不出来可以接受，但需要各个环节本身能完成输入到输出的过程」
#   「judge 可以全部打回盲重抽，但不能给任何信息，相当于另外做一次」
#
# ---------------------------------------------------------------------
# 两臂设计（唯一变量 = 预扫）
# ---------------------------------------------------------------------
#   A 臂（本 run）= 带预扫   ⇒ 产品当前 SOP 形态的真实水平
#   B 臂          = 不带预扫 ⇒ 与 07-07 那个 8/8 条件最接近，可直接对比
#   两臂其余一切相同：同模型、同 skill、同硬隔离、同零监督、同判卷尺。
#
# 预扫固定档（**跑前写死，跑完不论结果如何都不改**）——
# 出处 skills/intake_pipeline/0_reading/cv_toolbox.md §"Budget prescan candidates"：
#   平面   : --min-strength 0.08 --min-line-len-px 30
#   立面   : --min-strength 0.08 --min-line-len-px 30 --no-cc
# ⚠️ 这一档正是 plan.md 登记的跟进债 #3「纪律写给了错的角色、从未被用上」——
#    它写在读图器看的 cv_toolbox.md 里，而预扫是主控/管线跑的。本 run 首次实际执行它。
#
# ---------------------------------------------------------------------
# 前置改动（用户 08-01 批准，本 run 是它的第一次实跑）
# ---------------------------------------------------------------------
#   session_kickoff.md §Workflow：删「做完一张停下等审阅」，改为「第一张做完后
#   自己跑 guide.md §6 自检、修完再继续」。isolation.py:642 生成的 spawn prompt
#   里同一句副本一并改掉（否则改动无效）。备份 backup/Skill_history/
#   2026-08-01_remove_pilot_review_stop/。
#   理由：不改它，读图器必然停在半路等主控回答，这一轮测不出任何东西。
# =====================================================================

scope:
  stages:
    - 0_reading           # 本 run 只到识图 + 判卷；下游不跑（今天的目的是拿基线数）

judge:
  mode: "stop"            # 判卷停点由主控裁；但**不得**把裁定内容回灌给读图器

review:
  reading: false
  correction: false
  geometry: false         # 不跑几何段

models:
  reading: claude-haiku-4-5-20251001

capability_profile: orthogonal_polygon

grade:
  reading:
    wall_tol_m: 0.30      # 与 07-07 / 07-30 历史对账同一把尺，不得放松
    window_centre_tol_m: 0.40
  correction:
    wall_tol_m: 0.30
    window_centre_tol_m: 0.40

# CLI 承载项（非 RunConfig 字段，记此备查）:
#   run_profile = regression（fail-closed，与历史两轮同档）
#   不 --record（只到识图，无完整基线可录）
