# =====================================================================
# run_config.yaml — run_2026-08-02_sonnet_full_unsup (sm24_anchor)
#
# 【全卷无监督 · Sonnet 5 + 工具箱 —— 排除「减卷」这个变量】
#
# 用户 2026-08-02 拍板：
#   「重试一次 sonnet + 工具箱 + 无监督，把 sm24 reading 完整做一遍，
#     我怀疑是减卷造成了判定不准。」
#
# 用户同时给出的三条反驳（针对主控此前把历史高分归因为「监督污染 / 可能泄题」）：
#   ① Sonnet 之前能做到 100%，在 CV 工具箱已经搭好的情况下没理由这次这么差；
#   ② **sm24 识图做得特别好的时候，gt 还没有做** ⇒ 物理上不可能是答案泄露；
#   ③ sm21 上 GPT-5.4-mini 也做得很好、只错了一点点
#      —— **答案泄露不会只错一点点**（泄题应当近乎全对）。
#   ⇒ 用户判断：**主要原因是这段时间把机制改坏了**，不是模型或监督问题。
#
# 主控当日已撞到的、支持该判断的机制缺陷（全部是近期新增的东西）：
#   - 合并门的命名契约自相矛盾（kickoff 通则 `<name>_view.json` vs 表格 `1f_view.json`），
#     图名以 `_view` 结尾的 case 必踩，读图器照通则做即被拒收；
#   - 识图产物由 merge 进入时**渲染路径整个不跑**（run_one_stage 早退 ⇒ 不调 _draw_reading）
#     ⇒ 用户看不到任何产物图（用户 08-02 当面反映）；
#   - 减卷（W4）第一次真用就撞出判卷 BLOCKER（08-01，已修）；
#   - gate① 与 CV 证据之间零接线。
#
# ---------------------------------------------------------------------
# 本 run 与 run_2026-08-01_sonnet_pathref_s1 的唯一差别 = 考试范围
# ---------------------------------------------------------------------
#   **不声明 reading_exam_scope ⇒ 全卷五张**
#   （1f_view + South_view + North_view + East_view + West_view）。
#   模型、skill 库、硬隔离档次、判卷尺、run_profile 全部相同。
#   ⇒ 若成绩显著回升，则「减卷」是判定失真的原因（用户假设成立）；
#      若成绩相当，则减卷不是原因，需另找机制缺陷。
#
# ⚠️ 与历史成绩对比的量纲警告（主控 08-02 自我更正）：
#   07-07 那个「8/8」是**当时的尺子**量的；现在这把 v3 生产判卷层 2026-07-31 才建成。
#   两者未经对齐前**不得直接并排比较**——此前主控把 8/8 与 70.9% 并列是不严谨的。
#
# ---------------------------------------------------------------------
# 无监督的硬定义（违反即本 run 作废，沿用 W5 / pathref 口径）
# ---------------------------------------------------------------------
#   ⛔ 零 per-run directive · 零 feedback · 零中途反馈（停下提问即计未完成，不补话）
#   ⛔ 不跑预扫（用户 08-01 口径：预扫属质量之后的提速项；两份历史达标产物都没有它）
#   ✅ 允许：主控编排（建 staging / spawn / merge）、硬隔离、判卷用生产尺子
#   ✅ 读图器自己调 cv_probe 工具箱（那是它自己的工序，不是投喂）
# =====================================================================

# 不声明 reading_exam_scope = 全卷五张

scope:
  stages:
    - 0_reading           # 只跑识图 + 判卷；下游不跑

judge:
  mode: "stop"

review:
  reading: false
  correction: false
  geometry: false

models:
  reading: claude-sonnet-5

capability_profile: orthogonal_polygon

grade:
  reading:
    wall_tol_m: 0.30      # 与 07-30 / 08-01 / W5 / pathref 同一把尺，不得放松
    window_centre_tol_m: 0.40
  correction:
    wall_tol_m: 0.30
    window_centre_tol_m: 0.40

# CLI 承载项（非 RunConfig 字段，记此备查）:
#   run_profile = regression（fail-closed）
#   不 --record（只到识图）
