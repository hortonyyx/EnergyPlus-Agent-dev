# =====================================================================
# run_config.yaml — run_2026-08-01_sonnet_pathref_s1 (sm24_anchor)
#
# 【第 0 步 · 把「路径」和「模型档」两个变量拆开 · 第 1 抽】
#
# 用户 2026-08-01 拍板的原则（本 run 的存在理由）：
#   「先保证质量，从高模型往低模型上降，而不是先降模型、拿到一个很低的分数
#     再想办法提分数。既然已经有 Sonnet 几乎全对、Haiku 加轻量主控介入也基本
#     全对的情况，不应该容忍分数掉到 40–70% 再想办法提升。」
#   「之前的成绩是假象」= 指「Haiku 纯自己做到全对」是假象，
#   **不是**指那个 100% 是作弊 —— 100% 是真的，只是不是低档模型的单一功劳。
#   「应该思考的是怎么把这条已经存在的正确路径让 Haiku 也掌握，
#     而不是为 Haiku 或为这两个 case 定一套方案然后想办法迭代。」
#
# ---------------------------------------------------------------------
# 本 run 只回答一个问题
# ---------------------------------------------------------------------
#   **高档模型（Sonnet 5）在完全无监督下，能不能自己把这条路走到接近全对？**
#
#   - 能 ⇒ 拿到一条「无监督可达标」的基准路径，降档才有参照物；
#          且同时证明**现有文档作为说明书是够的**，此前三次「说了不听」
#          应归到模型档或摩擦，而非「文档没用」（该结论此前被主控写得过死，
#          用户 08-01 要求不定死，本 run 即其判据来源之一）。
#   - 不能 ⇒ 问题在路径/启动文档本身，与模型档无关，先修路径再谈降档。
#
#   ⚠️ 这个实验此前从未做过：07-02 那份 9/9 是 Sonnet 但带 pilot 检查点；
#      07-07 那份 8/8 是 Haiku 但中途被主控按子部分打回过。
#      **「高档 + 零介入」这一格一直是空的。**
#
# ---------------------------------------------------------------------
# 无监督的硬定义（违反即本 run 作废，沿用 W5 口径）
# ---------------------------------------------------------------------
#   ⛔ 零 per-run directive        —— `spawn --directive` 不传
#   ⛔ 零 feedback                 —— staging 内不得出现 feedback.md
#   ⛔ 零中途反馈 / 零打回续作      —— 主控不回答子代理任何提问；
#                                     它若中途停下提问，本轮即以「未完成」计，不补话
#   ✅ 允许：主控编排（建 staging / spawn / merge）、硬隔离、判卷用生产尺子
#
# ---------------------------------------------------------------------
# ⭐ 与 W5 两抽的唯一差别 = 模型档（Haiku 4.5 → Sonnet 5）+ 不带预扫
# ---------------------------------------------------------------------
#   考试范围逐字相同（1f_view + South_view）、判卷尺逐字相同（wall 0.30 / window 0.40）、
#   skill 库与硬隔离档次相同 ⇒ 与 d1（9.0%）/ d2（24.8%）可直接对比。
#
#   **不跑预扫**（用户 08-01 拍板）：预扫按用户口径属于「质量站住之后的提速方案」，
#   不作为质量杠杆；且两份历史达标产物（07-02 的 9/9、07-07 的 8/8）**都没有预扫**。
#   ⇒ 本 run 的 `cv_evidence/` 下若出现 `prescan/` 即配置错误。
#   读图器仍可自行调用 cv_probe 工具箱做裁图核验（那是它自己的工序，不是投喂）。
#
# ---------------------------------------------------------------------
# 抽数
# ---------------------------------------------------------------------
#   用户拍板：**先跑一抽看看**。
#   ⚠️ 本项目 08-01 实证同配置两抽差 2.8 倍 ⇒ **单抽成绩不作为结论**，
#      若这一抽达标，补第二抽后才算数；若不达标，也需第二抽排除坏运气。
# =====================================================================

reading_exam_scope:
  input_ids: [1f_view, South_view]
  reason: step-0 path-vs-tier separation draw; same scope as the W5 haiku draws for direct comparability

scope:
  stages:
    - 0_reading           # 只跑识图 + 判卷；下游不跑

judge:
  mode: "stop"            # 判卷停点由主控裁；**不得**把裁定内容回灌给读图器

review:
  reading: false
  correction: false
  geometry: false

models:
  reading: claude-sonnet-5

capability_profile: orthogonal_polygon

grade:
  reading:
    wall_tol_m: 0.30      # 与 07-07 / 07-30 / 08-01 / W5 历史对账同一把尺，不得放松
    window_centre_tol_m: 0.40
  correction:
    wall_tol_m: 0.30
    window_centre_tol_m: 0.40

# CLI 承载项（非 RunConfig 字段，记此备查）:
#   run_profile = regression（fail-closed，与历史各轮同档）
#   不 --record（只到识图，无完整基线可录）
