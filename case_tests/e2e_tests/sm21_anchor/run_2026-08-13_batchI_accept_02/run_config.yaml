# run_2026-08-13_batchI_accept_02 (sm21_anchor)
#
# 目的 = 摊 I 验收跑（第 2/3 次，重新计数——第 1 次 batchI_accept_01 越过了 surface
#   400，但撞上 surface 节点 0 面落库(卡在 VERTEX_FRAME_DRIFT 全 missing)，
#   已定位真因（LLM 发文字宣告但零 tool_calls / 大批次被截断触发幽灵 tool_call）
#   并修复：批量项数硬顶 4（工具层强制拒绝超限调用）+ 完整性自检兜底重试一轮 +
#   提示词加"禁止只宣告不调用"。真实复现（非 flow，直接调用 surface_agent 等
#   生产节点）已连续 2/2 次干净建满 100/100 面，无截断无卡壳。本 run 是这轮修法
#   后第一次真实 flow 全链验收。
#
# ─── 验收条件（跑前写死，⛔ 跑完不许放宽，抄自派工单 §4）───────────────
#   A1. 单次 flow 调用从 1_correction 跑到 EnergyPlus，中途不停/不修/不续跑/不人工干预。
#   A2. 真实退出码 0（只认独占 .rc 文件 + 汇总行；后台通知的 exit code 是外层壳的）。
#   A3. 三次验收里的第 2 次；每次都用新 run 目录。
#   A4. 0 Severe，且 IDF 内 100 面 / 15 窗 / 14 区。
#   A5. 几何不许变：与 run_2026-08-11_continuous_e2e 的 2_modelling 产物比顶点
#       （逐位同序全同）——⛔ 不许用 geometry_checkpoint_digest 判几何。
#   A6. 除 1_correction 的两次法定写入外，任何段不得出现重试；特别盯 4_mep。
# ────────────────────────────────────────────────────────────────

