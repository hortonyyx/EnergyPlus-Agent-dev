purpose: >-
  08-17 三件前置（F-51 单帧化 / scale_origin 退回 SHOULD / 跨轴合法出口）落地后的
  第一次开抽，以 07-07 模式（orchestrator 亲自审 pilot）跑 sm21 单抽探路。
  目标是「这条路今天走不走得通」，⛔ 不是拿分数结论。

