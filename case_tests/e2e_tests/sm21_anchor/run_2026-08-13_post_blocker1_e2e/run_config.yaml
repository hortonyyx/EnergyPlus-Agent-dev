#   ⇒ 本 run 是一次**工程缺陷勘察跑**，不是成绩跑，也不是「证明修法对了」的验收跑。
#   识图本轮一次没跑（逐字节复用），⇒ 本 run 不产生任何识图成绩。
#
# ⛔ 与上一个连续跑（run_2026-08-11_continuous_e2e）的唯一变量 = **代码基线前移**：
#   本 run 跑在 `da2245d` 上，其中包含今日三摊（输入逐字节相同，见 inputs）：
#     - 摊 A  = F-22 BLOCKER-1：确定性核印章由「产品自报」改为「落库方签发、绑进 accepted 账本的 proof」；
#              判卷只认账本上已验证的 proof，裸 dict 的内嵌印章最多算 declared。
#     - 摊 C  = MAJOR-C1：标注法观测中间档不再冒充「按外包标注」（生产侧无可信墙厚 ⇒ 如实报「未知」）。
#     - 摊 A′ = F-24 判卷缓存绑信任身份 + MINOR-A1 拒判不再单显 pass + NIT-F25 同名常量清理。
#
# ⭐ 本 run 顺带补一条**至今从未被观测过的证据**（sol 第四轮点名要的）：
#   摊 A 落地后，盘上**零份**真实产物带 proof ⇒ `trusted=True` 只在夹具与单测里出现过，
#   **真实 run 走通「拿到 trusted」这一侧从未发生**。本 run 是第一次有机会观测它。
#   ⇒ 观测项（非阻塞，跑完核）：① accepted 账本里是否真的多出第 7 件 `deterministic_core_proof`；
#      ② 判卷侧 `output_convention` 是否给出 `declared=True, trusted=True`；
#      ③ 侧车 `scorer_schema` 是否为 `"11"`（= 本仓**第一份**新版判卷缓存，F-24 的截止点正是此刻）。
#
# ⛔ 已知未闭合缺陷（跑之前就知道，⇒ 本 run 的判卷结论不得当作签收依据）：
#   sol 第四轮裁决 = CHANGES REQUIRED，`BLOCKER-1` 仍开（run-local 可变账本不算外部信任根；
#   且**删掉 proof 后缓存仍会给出 trusted=True**）· `MAJOR-F24` 仍开（只绑 2/3 身份、未绑当前 proof 身份）。
#   ⇒ 本 run 的价值在**工程链路**，不在判卷分数。
#
# 性质：**非正式工程勘察跑，⛔ 不是成绩跑**（沿用用户 2026-08-10 口径「这种非正式的都不用记，
#   写明是测什么就行了」）⇒ ⛔ 不走 flow --record，无 baseline.json / 无 report/REPORT.md。
#
# ⛔ 几何确认门走 auto 的理由与验收条件：
#   本 run 要的是「一口气跑完、看撞上什么」，人工停点与之直接冲突。用户已于 2026-08-10 看过
#   run_2026-08-09_f18_e2e_verify 的 manual_review/geometry_viewer.html 并当面确认几何无误。
#   参照 digest = 3409f90b9b8000092127875e0209767ab559ee818879ddc6af0b406dc704f4be
#   ⇒ **验收条件（已按 2026-08-11 教训收窄，⚠️ 与上一个 run 的写法不同）**：
#      digest 相同 ⇒ 合法迁移（人已看过的那份几何）；
#      digest 不同 ⇒ **⛔ 不得据此声称「几何变了」** —— `geometry_checkpoint_digest` 是
#      `hash_obj(kernel_check_report)`，报告里嵌着房间名，1_correction 的 LLM 换个房间叫法 digest 就变，
#      而顶点可能逐位完全相同（08-11 实证：460 顶点同序全同、digest 却不同）。
#      ⇒ digest 一变必须**改判据比顶点**，再决定是否需要重新出图请用户看。
#
# ⭐ 纪律：本文件**先于 provision 落盘**（08-09 实犯过：反了会冻结「flow 默认」策略，
#   之后配置一改就撞 policy 漂移门）。

