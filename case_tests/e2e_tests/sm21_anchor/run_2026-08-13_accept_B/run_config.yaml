provenance:
  base_commit: f2e6c47
  tracked_dirty: true    # ⚠️ 未提交：src/agent/nodes/surface.py + src/agent/tools/surface_tools.py + tests/test_batch_create_surfaces.py
  scaffold: 全仓 2590 passed / 10 xfailed / 0 failed（摊 H 后 orchestrator 独立实测；摊 I 后的全量待补）
inputs:
  reading:
    source: case_tests/e2e_tests/sm21_anchor/run_2026-08-11_continuous_e2e/0_reading
    method: 逐字节复制，cmp 逐件校验
models:
  correction: {model_id: deepseek-v4-pro, effort: high}
  mep: {model_id: deepseek-v4-pro, effort: high}
  downstream: {model_id: deepseek-v4-pro + deepseek-v4-flash, source: src/configs/llm.yaml 全局默认}
