# run_2026-08-13_batchI_accept_01 (sm21_anchor)
#
# 目的 = 摊 I 验收跑（第 1/3 次）。验证「加 create_surfaces_batch 工具 + surface
#   prompt 改用它」是否解开 DeepSeek 在 100 面场景下的 400（历史证据：本仓
#   run_2026-08-13_surface400_accept_01，同一基线代码 41f73e7、surface 节点
#   50 个 create_surface 调用 / 50 条配对完好的回应，仍被拒 400）。
#
# ─── 验收条件（跑前写死，⛔ 跑完不许放宽，抄自派工单 §4）───────────────
#   A1. 单次 flow 调用从 1_correction 跑到 EnergyPlus，中途不停/不修/不续跑/不人工干预。
#   A2. 真实退出码 0（只认独占 .rc 文件 + 汇总行；后台通知的 exit code 是外层壳的）。
#   A3. 本 run 是三次验收里的第 1 次；每次都用新 run 目录。
#   A4. 每次都 0 Severe，且 IDF 内 100 面 / 15 窗 / 14 区。
#   A5. 几何不许变：与 run_2026-08-11_continuous_e2e 的 2_modelling 产物比顶点
#       （逐位同序全同）——⛔ 不许用 geometry_checkpoint_digest 判几何。
#   A6. 除 1_correction 的两次法定写入外，任何段不得出现重试；特别盯 4_mep。
# ────────────────────────────────────────────────────────────────

