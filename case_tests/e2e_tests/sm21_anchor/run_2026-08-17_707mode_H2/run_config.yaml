# =====================================================================
# run_config.yaml — run_2026-08-17_707mode_H2 (sm21_anchor)
#
# H2 = H1 的接替跑。H1 因 **F-60** 作废（量图的路被 guard 堵死 ⇒ 观测不承载信息），
# 详见 ../run_2026-08-17_707mode_H1/VOID.md 与其 _run/pilot_r1/F60_guard_prose_false_positive.md。
#
# ⇒ H2 与 H1 的**唯一自变量差**就是 F-60 修法。其余配置逐项沿用。
#
# ---------------------------------------------------------------------
# 相对 H1 新增的改动（F-60 修法，orchestrator 施工，⛔ 零复审）
#
#   判据面（用户拍板「修」）：`guard.py` 的 `..` / `~` 由**裸子串匹配**
#     （`".." in text` / `"~" in text`，作用于整份文件正文）收窄为**路径形态**匹配：
#       `_TRAVERSAL_RE = ..[\\/] | [\\/].. | 独立 .. 段（前后非点非词字符）`
#       `_HOME_RE      = ~[\w.-]*[\\/]`
#     ⇒ 英文省略号、numpy 一元 `~`、`~180`、`z ~ 0.0`、`x[..., 0]` 不再误判。
#     ⚠️ 收窄 `~` 之所以安全，是因为真正能**展开**家目录的路都在别处按名字挡着且未动：
#        `cd`/`env` 在 `_check_bash` 按名字禁 · 只读命令参数走 `_path_arg`（拒绝 `~` 开头）·
#        `expanduser` / `.home()` 在 EXEC_DENY_IMPLICIT_PATHS。
#        ⛔ 删掉其中任何一条都会重新打开本次收窄让渡给它的那部分。
#
#   可自救面（未拍板，随修法一起做）：新增 `_token_reason`，
#     拒绝信息从「含禁忌 token」升级为**指名文件 + 行号 + 命中的原文**。
#     理由：扫描面读的是**每一个可写文件**，出事的往往不是被执行的那个
#     ⇒ 不指名就无法自救。同族 F-53/F-54/F-58。
#
#   ⛔ 扫描面：**不动**（用户 08-17 改判）。
#     我最初提的「只扫实际要跑的文件」经复核 = **08-16 跨家族复审已复现并封堵的漏洞**
#     （`out/main.py` 干净、`import out/helper.py`，路径藏在后者）——
#     见 `guard.py:868-896`。已补锁 `test_guard_f60_narrowing_did_not_shrink_the_scanned_surface`
#     钉住「不得拿 F-60 当借口窄化扫描面」。
#
#   锁：`tests/test_isolation.py` +17（7 正向 prose · 7 负向真实路径形态 ·
#     扫描面不缩 · 拒绝信息可自救 · 回归用例自证前提）。
#     **双向 neuter 实测**（临时 worktree，零仓库改动）：
#       退回老判据 ⇒ 正向锁 9 红 · 过度收窄 ⇒ 负向锁 5 红
#     ⇒ 两个方向都不是恒绿的门。⚠️ 该 neuter 由作者自测，**结论待独立复核**。
#
#   回归：受影响子集 **399 passed / 0 failed**
#     （test_isolation + test_reading_schema + test_reading_mode +
#       test_checks_reading_correction + test_reading_line_style_visibility）。
#
# ---------------------------------------------------------------------
# ⛔ 归因纪律（本跑最容易被自己糊弄的地方）
#
#   H1 与 H2 之间**只差 F-60 修法**，但这⛔**不**意味着 H2 的任何结果可以归因给 F-60。
#   F-60 修的是「路通不通」，不是「模型会不会走这条路」——
#   路通了之后它**仍然可能不去量**，那才是本批真正要测的东西。
#   ⇒ **F-60 是让归因可信的前置，不是修法。**（与 F-51 单帧化同一性质。）
#
#   ⚠️ H1 与 H2 之间还叠着 08-17 三件前置（F-51 单帧化 / scale_origin 退回 SHOULD /
#      跨轴合法出口）与 B1（pilot 停等门）——它们对 H1、H2 **都在场**，
#      所以 H2 依然⛔**不是**任何单项的单变量测试。
#
# ---------------------------------------------------------------------
# 跑前复核（沿用 H1 已验证项；带 ⭐ 的在 H2 的新 staging 上重验）
#
#   ⭐ ① 单帧化真实生效（staging 重建，须重验）
#   ⭐ ② F-60 修法真的进了 staging 的 guard 副本（不是只改了仓库源码）
#      ③ pilot 停等门接线在（H1 已验，逻辑未动）
#      ④ sm21 走 legacy 判卷（gt schema_version: 2；H1 已验，与本跑无关的改动）
#
# ---------------------------------------------------------------------
# 判读口径（与 H1 相同，⛔ 不因为「这次修好了工具」而放松）
#
#   ⛔⛔ **本抽的分数不得当结论**：同配置两抽实测差 2.8 倍，一抽是噪声。
#      本抽回答「这条路今天走不走得通」，⛔ 不是「达到什么水平」。
#
#   过程指标（比分数更早出信号）：
#     - CV 调用次数，尤其 crop_zoom（07-07 基准 55；08-15 七抽 0/0/0/2/1/6；H1 = 1 且 scale=1.0）
#     - **量了几张图**（历史六抽全部只量 1/6，最稳定的病征）
#     - ⭐ **自写代码是否真的跑起来了**（H1 = 两次尝试两次被拒 ⇒ 本项在 H1 上不可测）
#     - 打回后是否真的改
#     - 跨轴出口是否被触发（rc=0 且零机器消费者 ⇒ **必须人工翻 access_log 与产物**）
#   分数：墙 x/9 · 窗 x/7（07-07 基准 9/9 · 7/7 · 最大偏移 0.0 m）
# =====================================================================

