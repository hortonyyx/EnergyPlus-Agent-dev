#     ③ D1（修矛盾）    = local_x_positive 文档三处自相矛盾
#
#   ②不修就没法跑：CV 调用会全部 DENY，而 **CV 调用次数正是本跑要测的指标本身**
#   ⇒ 等于尺子坏着去量。因此②③是**修复**、不是自变量，但它们确实改变了环境。
#   **诚实口径 = 本跑测的是「门 + 可用的 CV 示例」这个组合。**
#
# ---------------------------------------------------------------------
# 本轮改动（工作树相对 f6f2c46，与本跑相关的三处）
#
#   B1-文档面: skills/intake_pipeline/0_reading/session_kickoff.md
