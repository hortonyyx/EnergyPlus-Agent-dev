#              **行为验证（真 staging + 真 guard）**：
#                旧形态 → DENY（"a script must live under out/ or requests/"）
#                新形态 → ALLOW ×4（rc=0），并真跑通一条，产物落在
#                out/cv/cv_evidence/1f_view/001_wall_line_profiler.json + overlay
